<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Butterfly PEMF Optimizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital@0;1&display=swap">
<style>
:root{
  --bg:#f6f5f2;--surface:#fcfcfb;--sunk:#f0efec;--ink:#0b0b0b;--ink2:#52514e;--muted:#767470;--grid:#e1e0d9;--axis:#c3c2b7;--hair:rgba(11,11,11,.10);--hair2:rgba(11,11,11,.18);
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#4a3aa7;--c8:#e34948;
  --accent:#2a78d6;--accent-ink:#ffffff;--accent-soft:#e3eefb;
  --ok:#006300;--warn:#8a5a00;--warn-bg:#fdf1d6;--bad:#b42626;--bad-bg:#fbe4e2;--ok-bg:#e2f3e2;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;--serif:"STIX Two Text","Cambria Math",Cambria,"Times New Roman",serif;
  --r:10px;--gut:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0d0d;--surface:#1a1a19;--sunk:#222221;--ink:#ffffff;--ink2:#c3c2b7;--muted:#99978f;--grid:#2c2c2a;--axis:#383835;--hair:rgba(255,255,255,.10);--hair2:rgba(255,255,255,.2);
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;
  --accent:#3987e5;--accent-ink:#0b0b0b;--accent-soft:#16283f;
  --ok:#3ec23e;--warn:#fab219;--warn-bg:#3a2d0a;--bad:#ff8a84;--bad-bg:#3b1616;--ok-bg:#12301a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0d0d;--surface:#1a1a19;--sunk:#222221;--ink:#ffffff;--ink2:#c3c2b7;--muted:#99978f;--grid:#2c2c2a;--axis:#383835;--hair:rgba(255,255,255,.10);--hair2:rgba(255,255,255,.2);
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;
  --accent:#3987e5;--accent-ink:#0b0b0b;--accent-soft:#16283f;
  --ok:#3ec23e;--warn:#fab219;--warn-bg:#3a2d0a;--bad:#ff8a84;--bad-bg:#3b1616;--ok-bg:#12301a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
b{font-weight:600}
.mut{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px var(--gut) 10px;max-width:1500px;margin:0 auto}
.top h1{font-size:18px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.top p{font-size:12.5px;color:var(--ink2);margin-top:2px;max-width:60ch}
.shell{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:0 var(--gut) 88px;max-width:1500px;margin:0 auto}
.main{min-width:0}
@media (min-width:1040px){
  .shell{grid-template-columns:340px minmax(0,1fr);padding-bottom:40px;align-items:start}
  .problem{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
  .pswitch{display:none!important}
}
@media (max-width:1039px){
  body[data-panel="views"] .problem{display:none}
  body[data-panel="problem"] .main{display:none}
}
.pswitch{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;padding:8px var(--gut) calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--hair2)}
.pswitch button{flex:1;min-height:44px;border-radius:var(--r);border:1px solid var(--hair2);background:var(--sunk);font-weight:500}
.pswitch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* chips & status */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--sunk);border:1px solid var(--hair)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.busy{color:var(--ink2)}
.chip.ok::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.spin{width:11px;height:11px;border-radius:50%;border:2px solid var(--axis);border-top-color:var(--accent);display:inline-block;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* readout */
.readout{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:8px 0 10px;margin:0 calc(var(--gut) * -1);padding-inline:var(--gut);border-bottom:1px solid var(--hair)}
@media (min-width:1040px){.readout{margin:0;padding-inline:0;top:0}}
.rohead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:8px}
#limitedby{font-size:12.5px;color:var(--ink2);min-width:0;flex:1 1 220px}
.kpis{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:2px}
.kpi{flex:0 0 auto;min-width:118px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:7px 10px;scroll-snap-align:start}
.kpi.big{background:var(--accent-soft);border-color:transparent;min-width:150px}
.kk{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.kv{font:600 22px/1.15 var(--mono);letter-spacing:-.02em}
.kv span{font-size:12px;font-weight:400;color:var(--ink2);margin-left:3px}
.ks{font-size:11.5px;color:var(--ink2);white-space:nowrap}
.kpi.bind{border-color:var(--warn)}.kpi.over{border-color:var(--bad);background:var(--bad-bg)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:0 6px;border-radius:4px;background:var(--warn-bg);color:var(--warn);margin-right:4px;vertical-align:1px}
.kpi.over .tag,.lrow.over .tag{background:var(--bad);color:var(--surface)}
@media (min-width:1040px){.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));overflow:visible}.kpi,.kpi.big{min-width:0}.ks{white-space:normal}.kv{font-size:20px}}

/* controls: segmented, chips, buttons */
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--hair);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;min-height:32px;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--hair2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--hair2);background:var(--surface);padding:5px 11px;border-radius:99px;min-height:32px;cursor:pointer;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.chips .bd{width:8px;height:8px;border-radius:50%;background:var(--c2);display:inline-block}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:7px 14px;border-radius:8px;min-height:36px;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:2px 10px;min-height:28px;font-size:12.5px}
.btn:hover{filter:brightness(1.07)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.toolrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:10px}
.sel{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
select,input[type=number]{background:var(--surface);border:1px solid var(--hair2);border-radius:8px;padding:6px 8px;min-height:34px;color:var(--ink);max-width:100%}
input[type=number]{width:74px;font-family:var(--mono);font-size:13px;text-align:right}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer}.chk.sm{font-size:12.5px;color:var(--ink2);margin-top:8px}

/* range */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:28px;margin:0;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--axis)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--axis)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--accent);margin-top:-7px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
input[type=range]:disabled{opacity:.4}

/* problem panel */
.problem{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:6px 14px 14px;min-width:0}
.ph{font-size:15px;font-weight:600;padding:10px 0 4px}
details.sec{border-top:1px solid var(--hair)}
details.sec:first-of-type{border-top:0}
details.sec summary{cursor:pointer;padding:11px 0;font-weight:600;font-size:13px;letter-spacing:.02em;list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:44px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.sec[open] summary::after{transform:rotate(-135deg)}
.secbody{display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.ctl{display:flex;flex-direction:column;gap:2px;min-width:0}
.cl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.cl .u{margin-left:auto;font:12px var(--mono);color:var(--muted)}
.ci{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:10px;align-items:center}
.hint{position:relative;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--axis);color:var(--muted);font:600 10px var(--mono);cursor:help;flex:none}
.hint:hover::after,.hint:focus::after{content:attr(data-tip);position:absolute;left:0;top:20px;z-index:30;width:min(260px,70vw);background:var(--ink);color:var(--surface);padding:8px 10px;border-radius:8px;font:400 12px/1.4 var(--sans);text-transform:none;letter-spacing:0;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.ph-foot{padding-top:6px}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--hair2);margin:12px 0}
.tabs button{border:0;background:transparent;padding:10px 14px;min-height:44px;white-space:nowrap;color:var(--ink2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
#panels>section{display:flex;flex-direction:column;gap:12px;min-width:0}
#panels>section[hidden]{display:none}

/* cards */
.card{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:14px;min-width:0}
.card h3{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--ink2);margin:4px 0 8px;max-width:75ch;text-wrap:pretty}
.card .note:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px}
.grid2>*{min-width:0}

/* field map */
.mapwrap{position:relative;display:flex;justify-content:center;touch-action:pan-y}
.mapwrap canvas{display:block;max-width:100%;border-radius:6px;cursor:crosshair}
.maptip,.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--surface);padding:5px 9px;border-radius:7px;font-size:12px;line-height:1.35;white-space:nowrap}
.maptip b,.tip b{font-family:var(--mono);font-weight:600}
.maptip span{display:block;opacity:.8}
.cb{margin-top:10px;max-width:560px;margin-inline:auto}
.cbbar{height:10px;border-radius:5px;position:relative}
.cbm{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink);box-shadow:0 0 0 1px var(--surface)}
.cbtk{position:relative;height:16px;font:11px var(--mono);color:var(--muted)}
.cbtk span{position:absolute;transform:translateX(-50%);top:3px}
.cbu{font-size:11.5px;color:var(--ink2);text-align:center}

/* charts */
.chart{min-width:0}
.chart .legend,.slleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin-bottom:4px}
.slleg{margin:8px 0 0}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{display:inline-block;width:16px;height:3px;border-radius:2px}
.lg i.sq{width:26px;height:10px;border-radius:2px}
.lg i.hatch{width:12px;height:12px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--ink) 0 1px,transparent 1px 4px);opacity:.5;border:1px solid var(--axis)}
.lg i.dot{width:8px;height:8px;border-radius:50%;background:var(--ink)}
.plot{position:relative}
.plot svg{display:block;max-width:100%;height:auto;touch-action:pan-y}
.chart .grid{stroke:var(--grid);stroke-width:1}.chart .axis{stroke:var(--axis)}.chart .axtick{stroke:var(--axis)}
.chart .tick{fill:var(--muted);font:11px var(--mono)}.chart .axl{fill:var(--ink2);font:11.5px var(--sans)}
.chart .ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 4}.chart .reflab{fill:var(--ink2);font:11px var(--sans)}
.chart .xh{stroke:var(--ink);stroke-width:1;opacity:.5}
.chart .tip{top:4px;display:flex;flex-direction:column;gap:2px}
.chart .tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.chart .empty{padding:30px;text-align:center;color:var(--muted)}

/* optimum tab */
#vars{display:flex;flex-direction:column;gap:6px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto 40px;grid-template-areas:"n v l" "s s s";gap:0 10px;align-items:center;padding:8px 0;border-top:1px solid var(--hair)}
.vrow:first-child{border-top:0}
.vname{grid-area:n;min-width:0;display:flex;flex-direction:column}
.vname label{font-weight:500}
.vname small{font-size:11.5px;color:var(--muted)}
.vname small.held{color:var(--accent);font-weight:600}.vname small.atb{color:var(--warn);font-weight:500}
.vval{grid-area:v;font-family:var(--mono);text-align:right;white-space:nowrap}.vval b{font-size:16px}.vval span{color:var(--muted);font-size:12px}
.vsl{grid-area:s}
.vend{display:flex;justify-content:space-between;font:10.5px var(--mono);color:var(--muted);margin-top:-4px}
.lockb{grid-area:l;width:40px;height:40px;border-radius:8px;border:1px solid var(--hair2);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.lockb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"n v" "b b" "l l";gap:2px 12px;padding:10px 0;border-top:1px solid var(--hair)}
.lrow:first-child{border-top:0}
.ln{grid-area:n;font-weight:500;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.ln em{font-style:normal}
.lv{grid-area:v;font:12.5px var(--mono);color:var(--ink2);text-align:right}
.lb{grid-area:b}
.bar{position:relative;height:8px;border-radius:4px;background:var(--sunk);overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent);opacity:.55}
.lrow.act .bar i{background:var(--c2);opacity:1}
.lrow.over .bar i{background:var(--bad);opacity:1}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);text-decoration:none}
.ll{grid-area:l;font-size:12.5px;display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--ink2)}
.lam{font-family:var(--mono);font-weight:600;color:var(--ink)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px}
.kgrid div{display:flex;flex-direction:column;border-left:2px solid var(--hair2);padding-left:10px;min-width:0}
.kgrid span{font-size:11.5px;color:var(--muted)}.kgrid b{font:600 16px var(--mono)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.eqline{font-family:var(--serif);font-size:19px;padding:6px 0;overflow-x:auto}
#slwrap{width:100%;max-width:560px;margin-inline:auto}

/* tables */
.tablewrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font:12.5px var(--mono);font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--hair);white-space:nowrap}
th{font:600 11.5px var(--sans);color:var(--muted)}
th.l,td.l{text-align:left;font-family:var(--sans)}
tr.best td{background:var(--ok-bg)}tr.ref td{color:var(--ink2)}

/* supplies */
.sbar{display:grid;grid-template-columns:130px minmax(0,1fr) auto;grid-template-areas:"n b v" ". s s";gap:2px 12px;align-items:center;padding:6px 0}
.sn{grid-area:n;font-weight:500}.sn em{font-style:normal;font-size:11px;color:var(--accent);margin-left:4px}
.sbt{grid-area:b;height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.sbt i{display:block;height:100%;background:var(--c1);border-radius:0 6px 6px 0;transition:width .3s}
.sbt i.bad{background:var(--c8)}
.sbar.cur .sbt i{background:var(--accent)}
.sv{grid-area:v;font:600 13px var(--mono)}.ss2{grid-area:s;font-size:12px;color:var(--ink2)}
@media (max-width:520px){.sbar{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n v" "b b" "s s"}}

/* equations */
.eq{padding:12px 0;border-top:1px solid var(--hair)}
.eq:first-of-type{border-top:0}
.eqt{font-weight:600;font-size:13px}
.eqf{font-family:var(--serif);font-size:18px;line-height:2;padding:4px 0;overflow-x:auto;overflow-y:hidden;white-space:nowrap}
.eqf i,.eqline i{font-style:italic}
.eqf .up{font-style:normal}
.eqv{font:12.5px var(--mono);color:var(--ink);background:var(--sunk);border-radius:6px;padding:6px 10px;overflow-wrap:anywhere}
.eqv span{font:600 10.5px var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-right:8px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.25}
.fr .nu{border-bottom:1px solid currentColor;padding:0 .2em}.fr .de{padding:0 .2em}
.sq{display:inline-flex;align-items:stretch}
span.sq .rd{font-size:1.15em}.sq .rb{border-top:1px solid currentColor;padding:0 .1em}
.up{font-style:normal}
.hat{position:relative;display:inline-block}.hat::before{content:"^";position:absolute;left:0;right:0;top:-.55em;text-align:center;font-size:.8em}
.vec{font-weight:700;font-style:normal}
.qd{display:inline-block;width:1.2em}.th{display:inline-block;width:.17em}.sp{display:inline-block;width:.28em}
.big{font-size:1.5em;vertical-align:-.1em;line-height:1}
.ss{display:inline-flex;flex-direction:column;vertical-align:middle;line-height:1;font-size:.7em}
.ss sup,.ss sub{font-size:1em;vertical-align:baseline;line-height:1.1}
sup,sub{font-size:.7em;line-height:0}
.eqg h3 .tag{margin:0}

/* build */
.dl{display:flex;flex-direction:column;margin:0}
.dl>div{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid var(--hair)}
.dl>div:first-child{border-top:0}
.dl dt{color:var(--muted);font-size:12.5px}.dl dd{margin:0;overflow-wrap:anywhere}
pre.code{margin:0;background:var(--sunk);border-radius:8px;padding:12px;overflow-x:auto;font:12px/1.55 var(--mono);color:var(--ink)}
ul.check{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}

<script id="core">
/* PEMF butterfly-coil physics + augmented-Lagrangian optimizer.
   Pure JS, no dependencies. Works in Node (tests) and in the browser (inlined into the page).
   SI units everywhere internally (m, A, T, s, K or degC as noted). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.PEMF = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  const PI = Math.PI;
  const MU0 = 4e-7 * PI;
  const K = { rho20: 1.724e-8, alpha: 0.0039, dens: 8960, cp: 385, gmdRound: 0.7788, gmdRect: 0.2235 };

  /* ---------------------------------------------------------------- wire */
  function awgDia(awg) { return 1e-3 * 0.127 * Math.pow(92, (36 - awg) / 39); }
  function enamel(d) { return 0.012e-3 + 0.015 * d; }            // per-side enamel build
  function smax(a, b, eps) { return 0.5 * (a + b + Math.sqrt((a - b) * (a - b) + eps * eps)); }
  function skinFactor(d, f) {                                     // R_ac/R_dc, small-argument series
    const delta = Math.sqrt(K.rho20 / (PI * Math.max(f, 1e-3) * MU0));
    const x = d / 2 / delta; return 1 + Math.pow(x, 4) / 48;
  }

  /* ---------------------------------------------------------------- defaults */
  function defaults() {
    return {
      nRings: 5, nLay: 0,
      gap: 0.008, phi: 0.85, rin: 0.012,
      depth: 0.06, standoff: 0.010,
      objective: 'maxB', BaReq: 2e-3,
      acute: { f: 100, wave: 'sine', duty: 1.0, tsess: 600 },
      recov: { f: 20, wave: 'sine', duty: 1.0, tsess: 3600, Bpk: 0.5e-3 },
      supply: { name: '24 V battery', kind: 'battery', Voc: 24, Rsrc: 0.08, Pmax: 720, capWh: 120 },
      drive: { Rds: 0.005, Rsh: 0.005, Rwire: 0.02, Dmax: 0.95, fpwm: 20000, tsw: 1.2e-7, Isw: 60 },
      thermal: { Ta: 22, Tcore: 37, hdn: 6, kc: 0.05, ht: 40, spread: 1.5, Cx: 2000, Tmax: 60, Tskin: 41 },
      Elim: 0.8,
      size: { Wmax: 0.40, Lmax: 0.30, Hmax: 0.030, mmax: 2.0, Pcap: Infinity },
      price: 13
    };
  }
  const SUPPLIES = {
    wall12: { name: '12 V wall supply', kind: 'wall', Voc: 12, Rsrc: 0.02, Pmax: 120, capWh: Infinity },
    wall24: { name: '24 V wall supply', kind: 'wall', Voc: 24, Rsrc: 0.02, Pmax: 240, capWh: Infinity },
    bat24: { name: '24 V battery', kind: 'battery', Voc: 24, Rsrc: 0.08, Pmax: 720, capWh: 120 },
    bat48: { name: '48 V battery', kind: 'battery', Voc: 48, Rsrc: 0.15, Pmax: 1440, capWh: 240 }
  };

  /* ---------------------------------------------------------------- waveforms
     i(t) = I_pk g(tau); kRms = rms(g), slew = max|dg/dtau|, kAbs = mean|g|, vpk: peak of R i + L di/dt per amp */
  const WAVES = {
    sine: { name: 'Sine (bipolar)', krms: Math.SQRT1_2, slew: 2 * PI, kabs: 2 / PI, g: t => Math.sin(2 * PI * t), vpk: (R, L, f) => Math.sqrt(R * R + Math.pow(2 * PI * f * L, 2)) },
    tri: { name: 'Triangle (bipolar)', krms: 1 / Math.sqrt(3), slew: 4, kabs: 0.5, g: t => { const u = t - Math.floor(t); return u < 0.25 ? 4 * u : u < 0.75 ? 2 - 4 * u : 4 * u - 4; }, vpk: (R, L, f) => R + 4 * f * L },
    half: { name: 'Half-sine pulse (unipolar)', krms: 0.5, slew: 2 * PI, kabs: 1 / PI, g: t => Math.max(0, Math.sin(2 * PI * t)), vpk: (R, L, f) => Math.sqrt(R * R + Math.pow(2 * PI * f * L, 2)) }
  };

  /* ---------------------------------------------------------------- geometry */
  function geometry(x, P) {
    const d = awgDia(x.awg), dI = d + 2 * enamel(d), Acu = PI * d * d / 4;
    const tRaw = x.N * dI * dI / (P.phi * x.b);
    const t = smax(tRaw, dI, 0.05 * dI);
    const lturn = 2 * (x.wx + x.ly) - 4 * x.b;
    const lw = 2 * x.N * lturn;
    const g = {
      wx: x.wx, ly: x.ly, N: x.N, awg: x.awg, th: x.th, b: x.b,
      d, dI, Acu, tRaw, t, lturn, lw,
      R20: K.rho20 * lw / Acu,
      mcu: K.dens * lw * Acu,
      Aband: 2 * (x.wx * x.ly - (x.wx - 2 * x.b) * (x.ly - 2 * x.b)),
      layers: t / dI
    };

  }
  /* continuum winding: a Rb x Rz grid of filament rings; each carries N/(Rb*Rz) turns.
     Rb adapts to N (=> exact turn-by-turn model at integer N <= Rbmax). */
  function makeRings(geo, Rbmax, Rz) {
    Rz = Rz || Math.min(2, Math.max(1, Math.round(geo.t / geo.dI)));
    const Rb = Math.max(1, Math.min(Rbmax, Math.round(geo.N)));
    const s = [], n = [], z = [];
    for (let i = 0; i < Rb; i++) for (let j = 0; j < Rz; j++) {
      s.push((i + 0.5) * geo.b / Rb); n.push(geo.N / (Rb * Rz)); z.push(((j + 0.5) / Rz - 0.5) * geo.t);
    }
    return { s, n, z, R: s.length, Rb, Rz, cb: geo.b / Rb, cz: geo.t / Rz };
  }
  /* exact turn-by-turn winding (one filament per turn, layered) for verification and the build sheet */
  function discreteRings(geo) {
    const N = Math.max(1, Math.round(geo.N)), Ld = Math.max(1, Math.round(geo.t / geo.dI)), npl = Math.ceil(N / Ld);
    const s = [], n = [], z = [];
    for (let i = 0; i < N; i++) { const l = Math.floor(i / npl), j = i % npl; s.push((j + 0.5) * geo.b / npl); z.push((l - (Ld - 1) / 2) * geo.t / Ld); n.push(1); }
    return { s, n, z, R: N, Rb: N, Rz: 1, cb: geo.b / npl, cz: geo.t / Ld, Ld, npl };
  }
  /* one ring of one wing: 4 segments in global coords, CCW in (u,v); wing 2 is the mirror image (=> opposite sense) */
  function ringSegs(geo, sigma, s, zo, gap) {
    const ct = Math.cos(geo.th), st = Math.sin(geo.th), wx = geo.wx, ly = geo.ly;
    const loc = [[s, -ly / 2 + s], [wx - s, -ly / 2 + s], [wx - s, ly / 2 - s], [s, ly / 2 - s]];
    const nx = -sigma * st, nz = ct;
    const pts = loc.map(p => [sigma * (gap / 2 + p[0] * ct) + zo * nx, p[1], p[0] * st + zo * nz]);
    const out = [];
    for (let i = 0; i < 4; i++) { const a = pts[i], b = pts[(i + 1) % 4]; out.push([a[0], a[1], a[2], b[0], b[1], b[2]]); }
    return out;
  }
  function buildSegs(geo, rg, P) {
    const cnt = rg.R * 8;
    const S = new Float64Array(cnt * 7); let o = 0;
    for (const sigma of [1, -1]) for (let k = 0; k < rg.R; k++) {
      const sg = ringSegs(geo, sigma, rg.s[k], rg.z[k], P.gap);
      for (const q of sg) { S[o] = q[0]; S[o + 1] = q[1]; S[o + 2] = q[2]; S[o + 3] = q[3]; S[o + 4] = q[4]; S[o + 5] = q[5]; S[o + 6] = rg.n[k]; o += 7; }
    }

  }

  /* ---------------------------------------------------------------- field: closed-form straight segments
     B = mu0/(4 pi d) (sin a2 - sin a1) (t x dhat) ;  A = mu0/(4 pi) t [asinh(s2/d) - asinh(s1/d)]   (per ampere) */
  const _o = new Float64Array(6);
  function fieldAt(S, px, py, pz, out) {
    out = out || _o;
    let Bx = 0, By = 0, Bz = 0, Ax = 0, Ay = 0, Az = 0;
    for (let i = 0; i < S.length; i += 7) {
      const x1 = S[i], y1 = S[i + 1], z1 = S[i + 2], wt = S[i + 6];
      let tx = S[i + 3] - x1, ty = S[i + 4] - y1, tz = S[i + 5] - z1;
      const len = Math.sqrt(tx * tx + ty * ty + tz * tz); tx /= len; ty /= len; tz /= len;
      const rx = px - x1, ry = py - y1, rz = pz - z1;
      const s = rx * tx + ry * ty + rz * tz;
      const qx = rx - s * tx, qy = ry - s * ty, qz = rz - s * tz;
      let d = Math.sqrt(qx * qx + qy * qy + qz * qz); if (d < 1e-9) d = 1e-9;
      const s1 = -s, s2 = len - s;
      const f = (s2 / Math.sqrt(s2 * s2 + d * d) - s1 / Math.sqrt(s1 * s1 + d * d)) / d * wt;
      const inv = 1 / d;
      Bx += f * (ty * qz - tz * qy) * inv; By += f * (tz * qx - tx * qz) * inv; Bz += f * (tx * qy - ty * qx) * inv;
      const a = (Math.asinh(s2 / d) - Math.asinh(s1 / d)) * wt;
      Ax += a * tx; Ay += a * ty; Az += a * tz;
    }
    const c = MU0 / (4 * PI);
    out[0] = Bx * c; out[1] = By * c; out[2] = Bz * c; out[3] = Ax * c; out[4] = Ay * c; out[5] = Az * c;

  /* vector potential only (cheaper): used for the induced-E survey */
  function potentialAt(S, px, py, pz, out) {
    let Ax = 0, Ay = 0, Az = 0;
    for (let i = 0; i < S.length; i += 7) {
      const x1 = S[i], y1 = S[i + 1], z1 = S[i + 2], wt = S[i + 6];
      let tx = S[i + 3] - x1, ty = S[i + 4] - y1, tz = S[i + 5] - z1;
      const len = Math.sqrt(tx * tx + ty * ty + tz * tz); tx /= len; ty /= len; tz /= len;
      const rx = px - x1, ry = py - y1, rz = pz - z1;
      const s = rx * tx + ry * ty + rz * tz;
      const qx = rx - s * tx, qy = ry - s * ty, qz = rz - s * tz;
      let d = Math.sqrt(qx * qx + qy * qy + qz * qz); if (d < 1e-9) d = 1e-9;
      const a = (Math.asinh((len - s) / d) - Math.asinh(-s / d)) * wt;
      Ax += a * tx; Ay += a * ty; Az += a * tz;
    }
    const c = MU0 / (4 * PI); out[0] = Ax * c; out[1] = Ay * c; out[2] = Az * c; return out;
  }
  /* skin surface = coil top face offset by the stand-off, along each wing normal, plus the junction line */
  function skinPoints(geo, P, nu, nv) {
    const pts = []; const ct = Math.cos(geo.th), st = Math.sin(geo.th);
    const off = geo.t / 2 + P.standoff;
    for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
      const u = (i + 0.5) / nu * geo.wx, v = (j / (nv - 1)) * geo.ly * 0.46;
      pts.push([P.gap / 2 + u * ct - off * st, v, u * st + off * ct]);
    }
    for (let j = 0; j < nv; j++) pts.push([0, (j / (nv - 1)) * geo.ly * 0.46, off]);
    return pts;
  }
  function peakA(S, geo, P) {
    const pts = skinPoints(geo, P, 4, 2); let m = 0, at = null; const o = new Float64Array(3);
    for (const p of pts) { potentialAt(S, p[0], p[1], p[2], o); const a = Math.hypot(o[0], o[1], o[2]); if (a > m) { m = a; at = p; } }
    return { aE: m, at };
  }

  /* ---------------------------------------------------------------- inductance (Neumann, closed form for parallel segments) */
  function psi(u, d) { return u * Math.asinh(u / d) - Math.sqrt(u * u + d * d); }
  function I2(a1, a2, b1, b2, d) { return psi(a2 - b1, d) + psi(a1 - b2, d) - psi(a2 - b2, d) - psi(a1 - b1, d); }
  /* concentric rectangles (half sizes hu,hv), parallel planes dz apart. dSameU/V = distance of like sides */
  function mutRect(hu1, hv1, hu2, hv2, dz, dSameU, dSameV) {
    const dOu = Math.sqrt(Math.pow(hv1 + hv2, 2) + dz * dz), dOv = Math.sqrt(Math.pow(hu1 + hu2, 2) + dz * dz);
    const Iu = 2 * I2(-hu1, hu1, -hu2, hu2, dSameU) - 2 * I2(-hu1, hu1, -hu2, hu2, dOu);
    const Iv = 2 * I2(-hv1, hv1, -hv2, hv2, dSameV) - 2 * I2(-hv1, hv1, -hv2, hv2, dOv);

  }
  const GLX = [-0.9324695142031521, -0.6612093864662645, -0.2386191860831969, 0.2386191860831969, 0.6612093864662645, 0.9324695142031521];
  const GLW = [0.1713244923791704, 0.3607615730481386, 0.4679139345726910, 0.4679139345726910, 0.3607615730481386, 0.1713244923791704];
  const GLT = []; for (let h = 0; h < 2; h++) for (let i = 0; i < 6; i++) GLT.push([h * 0.5 + 0.25 * (GLX[i] + 1), GLW[i]]);
  function segSegInt(a, b) {      // int int ds dt / |r| ; inner exact (asinh), outer 6-pt Gauss-Legendre on 2 sub-intervals
    let tx = a[3] - a[0], ty = a[4] - a[1], tz = a[5] - a[2];
    const len = Math.sqrt(tx * tx + ty * ty + tz * tz); tx /= len; ty /= len; tz /= len;
    const dx = b[3] - b[0], dy = b[4] - b[1], dz = b[5] - b[2]; const lenQ = Math.sqrt(dx * dx + dy * dy + dz * dz);
    let sum = 0;
    for (let k = 0; k < 12; k++) {
      const t = GLT[k][0];
      const rx = b[0] + dx * t - a[0], ry = b[1] + dy * t - a[1], rz = b[2] + dz * t - a[2];
      const s = rx * tx + ry * ty + rz * tz;
      const ax = rx - s * tx, ay = ry - s * ty, az = rz - s * tz;
      let d = Math.sqrt(ax * ax + ay * ay + az * az); if (d < 1e-9) d = 1e-9;
      sum += GLT[k][1] * (Math.asinh((len - s) / d) - Math.asinh(-s / d));
    }
    return sum * lenQ / 4;
  }
  function diagGMD(geo, n, rg) {
    const gw = K.gmdRound * geo.d / 2, gb = K.gmdRect * (rg.cb + rg.cz), nh = Math.max(n, 1);
    return Math.exp(Math.log(gw) / nh + (1 - 1 / nh) * Math.log(gb));
  }
  function crossMutual(sa, sb) {          // signed mutual inductance of two single-turn rings (wing1 ring, wing2 ring)
    let M = 0;
    for (const A of sa) for (const B of sb) {
      const ua = [A[3] - A[0], A[4] - A[1], A[5] - A[2]], ub = [B[3] - B[0], B[4] - B[1], B[5] - B[2]];
      const la = Math.hypot(ua[0], ua[1], ua[2]), lb = Math.hypot(ub[0], ub[1], ub[2]);
      const dot = (ua[0] * ub[0] + ua[1] * ub[1] + ua[2] * ub[2]) / (la * lb);
      if (Math.abs(dot) < 1e-9) continue;
      if (Math.abs(ua[1]) / la > 0.9999 && Math.abs(ub[1]) / lb > 0.9999) {
        const a1 = Math.min(A[1], A[4]), a2 = Math.max(A[1], A[4]), b1 = Math.min(B[1], B[4]), b2 = Math.max(B[1], B[4]);
        const d = Math.max(Math.hypot(A[0] - B[0], A[2] - B[2]), 1e-9);

  function inductance(geo, rg, P) {

    for (let k = 0; k < R; k++) for (let l = 0; l < R; l++) {
      const hu1 = geo.wx / 2 - rg.s[k], hv1 = geo.ly / 2 - rg.s[k], hu2 = geo.wx / 2 - rg.s[l], hv2 = geo.ly / 2 - rg.s[l];
      const dz = rg.z[k] - rg.z[l];

      else { dU = Math.hypot(hv1 - hv2, dz); dV = Math.hypot(hu1 - hu2, dz); }
      Lw += rg.n[k] * rg.n[l] * mutRect(hu1, hv1, hu2, hv2, dz, dU, dV);
    }
    /* wing-to-wing coupling is ~3% of L: a coarse 3-ring winding reproduces it to ~1% of M12 (<0.1% of L) */
    const rc = makeRings(geo, 3, 1), Rc = rc.R, W1 = [], W2 = [];
    for (let k = 0; k < Rc; k++) { W1.push(ringSegs(geo, 1, rc.s[k], rc.z[k], P.gap)); W2.push(ringSegs(geo, -1, rc.s[k], rc.z[k], P.gap)); }
    for (let k = 0; k < Rc; k++) for (let l = k; l < Rc; l++) {            // mirror symmetry: M(k,l) = M(l,k)
      const m = rc.n[k] * rc.n[l] * crossMutual(W1[k], W2[l]);

  /* ---------------------------------------------------------------- thermal (lumped, temperature-dependent copper) */
  function thermal(geo, P, P0, tsess) {
    const th = P.thermal;
    const Uup = 1 / (P.standoff / th.kc + 1 / th.ht);
    const Ath = geo.Aband * th.spread;
    const G = Ath * (th.hdn + Uup);

    const f0 = P0 * (1 + K.alpha * (Tref - 20)) / C;
    const Tat = t => { const x = lam * t; const ph = Math.abs(x) < 1e-6 ? 1 : (1 - Math.exp(-Math.min(x, 700))) / x; return Math.min(Tref + f0 * t * ph, 1e4); };

  /* ---------------------------------------------------------------- one operating mode */
  function modeCalc(geo, ind, aE, kB, P, M, I) {

    const Vav = dr.Dmax * (sp.Voc - sp.Rsrc * Ibus);
    return {
      I, Irms, Bpk: kB * I, Epk: W.slew * M.f * aE * I, dBdt: W.slew * M.f * kB * I,
      P0, T, Rhot, Pcoil, Pdrive, Psw, Pin, Vreq, Vav, Ibus, Rdrive, Fs,
      E_Wh: Pin * M.tsess / 3600, Ipk: I, W

  }

  /* ---------------------------------------------------------------- full design evaluation */
  const VARS = [
    { k: 'wx', label: 'Wing width', unit: 'mm', sc: 1e3, lo: 0.04, hi: 0.20, log: false, dec: 0 },
    { k: 'ly', label: 'Wing length', unit: 'mm', sc: 1e3, lo: 0.08, hi: 0.32, log: false, dec: 0 },
    { k: 'N', label: 'Turns per wing', unit: '', sc: 1, lo: 2, hi: 100, log: true, dec: 1 },
    { k: 'awg', label: 'Wire gauge', unit: 'AWG', sc: 1, lo: 8, hi: 28, log: false, dec: 1 },
    { k: 'th', label: 'Bend angle', unit: '°', sc: 180 / PI, lo: -0.1745, hi: 0.6109, log: false, dec: 1 },
    { k: 'b', label: 'Winding band', unit: 'mm', sc: 1e3, lo: 0.008, hi: 0.095, log: false, dec: 0 },
    { k: 'Ia', label: 'Acute peak current', unit: 'A', sc: 1, lo: 0.5, hi: 100, log: true, dec: 1 }

  const CONS = [
    { id: 'Tc_a', label: 'Coil temp, acute session', unit: '°C', grp: 'thermal' },
    { id: 'Ts_a', label: 'Skin temp, acute session', unit: '°C', grp: 'thermal' },

  const rgd = C.discreteRings(geo), rgc = C.makeRings(geo, P.nRings, P.nLay), zT = S.r.zT - g0.t / 2 + geo.t / 2;

    const nm = x => String(x).replace(/\./g, '_');
    this.esp = `// generated by the butterfly PEMF optimizer\nconst float V_BUS_V        = ${fx(P.supply.Voc, 1)}f;\nconst float F_ACUTE_HZ     = ${P.acute.f}.0f;\nconst float I_ACUTE_PK_A   = ${fx(A.I, 2)}f;\nconst uint32_t T_ACUTE_S   = ${Math.round(P.acute.tsess)};\nconst float DUTY_ACUTE     = ${fx(P.acute.duty, 2)}f;\nconst float F_RECOV_HZ     = ${P.recov.f}.0f;\nconst float I_RECOV_PK_A   = ${fx(R.I, 2)}f;\nconst uint32_t T_RECOV_S   = ${Math.round(P.recov.tsess)};\nconst float DUTY_RECOV     = ${fx(P.recov.duty, 2)}f;\nconst float I_HW_LIMIT_A   = ${fx(1.25 * Math.max(A.I, R.I), 1)}f;\nconst float T_COIL_CUT_C   = ${fx(P.thermal.Tmax - 5, 0)}f;\nconst float T_SKIN_CUT_C   = ${fx(P.thermal.Tskin - 0.5, 1)}f;\nconst float PWM_HZ         = ${P.drive.fpwm}.0f;\nconst float SHUNT_OHM      = ${fx(P.drive.Rsh, 4)}f;\nconst float MAX_DUTY       = ${fx(P.drive.Dmax, 2)}f;`;
    $('#espOut').textContent = this.esp;
    this.json = JSON.stringify({ design: { wing_width_mm: +fx(g.wx * 1e3, 1), wing_length_mm: +fx(g.ly * 1e3, 1), turns_per_wing: +fx(g.N, 2), awg: +fx(g.awg, 2), bend_deg: +fx(g.th * 180 / Math.PI, 2), band_mm: +fx(g.b * 1e3, 1), gap_mm: P.gap * 1e3 }, acute: { f_hz: P.acute.f, wave: P.acute.wave, i_pk_a: +fx(A.I, 3), b_target_mt: +fx(A.Bpk * 1e3, 3), e_pk_v_per_m: +fx(A.Epk, 3), coil_t_end_c: +fx(A.T.Tend, 1), skin_t_c: +fx(A.T.Ts, 1) }, recovery: { f_hz: P.recov.f, wave: P.recov.wave, i_pk_a: +fx(R.I, 3), b_target_mt: +fx(R.Bpk * 1e3, 3), e_pk_v_per_m: +fx(R.Epk, 3) }, electrical: { r20_mohm: +fx(g.R20 * 1e3, 1), l_uh: +fx(r.ind.L * 1e6, 1) }, source: { voc: P.supply.Voc, name: P.supply.name } }, null, 2);
  },
  paintSnap() {
    const el = $('#snapOut'); if (!el) return; const s = S.snap;
    if (!s) { el.innerHTML = ''; return; }
    const ok = s.rows.filter(Boolean).filter(o => o.res.kkt.viol < 5e-3), minP = S.P.objective === 'minP';
    const best = ok.length ? ok.reduce((a, o) => (minP ? metric(o.res) < metric(a.res) : metric(o.res) > metric(a.res)) ? o : a, ok[0]) : null;
    const [mn, mu] = metricName(), cont = minP ? S.sol.Pcoil : S.sol.Bpk * 1e3;
    el.innerHTML = `<div class="tablewrap"><table><thead><tr><th class="l">Option</th><th>${esc(mn)}, ${esc(mu)}</th><th>Change</th><th>Wing mm</th><th>Bend</th><th>Amps</th><th></th></tr></thead><tbody>
      <tr class="ref"><td class="l">Continuous optimum</td><td>${fx(cont, 2)}</td><td>–</td><td>${fx(S.x[0] * 1e3, 0)} × ${fx(S.x[1] * 1e3, 0)}</td><td>${fx(S.x[4] * 180 / Math.PI, 1)}°</td><td>${fx(S.x[6], 1)}</td><td></td></tr>
      ${s.combos.map((c, k) => { const o = s.rows[k]; if (!o) return `<tr><td class="l">AWG ${c.awg}, ${c.N} turns</td><td colspan="6" class="mut">solving…</td></tr>`; const x = o.res.x, v = metric(o.res), feas = o.res.kkt.viol < 5e-3;
        return `<tr${best === o ? ' class="best"' : ''}><td class="l">AWG ${c.awg}, ${c.N} turns${best === o ? ' <b class="tag">best</b>' : ''}</td><td>${fx(v, 2)}</td><td>${feas ? fx((v / cont - 1) * 100, 1) + '%' : '<span class="mut">infeasible</span>'}</td><td>${fx(x[0] * 1e3, 0)} × ${fx(x[1] * 1e3, 0)}</td><td>${fx(x[4] * 180 / Math.PI, 1)}°</td><td>${fx(x[6], 1)}</td><td>${feas ? `<button type="button" class="btn sm" data-adopt="${k}">Use</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div>${s.busy ? '<p class="note"><i class="spin"></i> Solving…</p>' : ''}`;
  }
};

/* ---------------- tab registry, render, init ---------------- */
const TAB_LIST = [['field', 'Field'], ['opt', 'Optimum'], ['lag', 'Lagrangian'], ['trade', 'Trade-offs'], ['eq', 'Equations'], ['build', 'Build sheet']];
S.sweep.axis = 'Pcap';
function showTab(id) {
  S.tab = id; const t = TABS[id], host = $('#panel_' + id);
  if (!t.built) { t.build(host); t.built = true; }
  $$('#tabs button').forEach(b => { const on = b.dataset.tab === id; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; });
  $$('#panels > section').forEach(p => { p.hidden = p.id !== 'panel_' + id; });
  if (id === 'lag') S.sliceStale = true;
  t.update();
}
function renderAll(fast) {
  renderStatus(); if (!S.r) return;
  renderReadout();
  const t = TABS[S.tab]; if (!t || !t.built) return;
  if (fast && (S.tab === 'lag' || S.tab === 'trade' || S.tab === 'build')) { if (S.tab === 'lag') S.sliceStale = true; return; }
  t.update();
}
function init() {
  loadState();
  $('#tabs').innerHTML = TAB_LIST.map(([k, n]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="false" aria-controls="panel_${k}">${esc(n)}</button>`).join('');
  $('#panels').innerHTML = TAB_LIST.map(([k]) => `<section id="panel_${k}" role="tabpanel" hidden></section>`).join('');
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) showTab(b.dataset.tab); });
  $('#tabs').addEventListener('keydown', e => { const ks = TAB_LIST.map(t => t[0]), i = ks.indexOf(S.tab); if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const n = ks[(i + (e.key === 'ArrowRight' ? 1 : ks.length - 1)) % ks.length]; showTab(n); $(`#tabs [data-tab=${n}]`).focus(); e.preventDefault(); } });
  $('#modeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.mode = b.dataset.m; renderAll(true); if (S.tab === 'lag') TABS.lag.update(true); } });
  $('#pswitch').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.panel = b.dataset.p; document.body.dataset.panel = S.panel; $$('#pswitch button').forEach(x => x.setAttribute('aria-pressed', x === b)); window.scrollTo(0, 0); });
  document.body.dataset.panel = 'views';
  renderControls(); wireControls();
  S.x = C.toX(coldStarts(1)[0]); quickEval();
  showTab('field'); renderAll();
  solveNow({ global: true });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const t = TABS[S.tab]; if (t && t.built && (S.tab === 'field' || S.tab === 'lag')) t.update(S.tab === 'lag'); }, 150); });
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { const t = TABS[S.tab]; if (t && t.built) t.update(); });
}
init();

})();
</script>
